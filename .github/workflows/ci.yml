name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: core
            command: yarn workspace @guide-me-app/core build
          - project: api
            command: yarn workspace @guide-me-app/api build
          - project: admin
            command: yarn workspace @guide-me-app/admin exec tsc --noEmit
          - project: web
            command: yarn workspace @guide-me-app/web exec tsc --noEmit
          - project: mobile
            command: yarn workspace @guide-me-app/mobile exec tsc --noEmit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      # Pin the exact yarn version that wrote yarn.lock. Without this CI
      # may end up on a newer 4.x point release whose lockfile cacheKey
      # differs, which breaks `yarn install --immutable`.
      - name: Activate pinned yarn
        run: corepack prepare yarn@4.16.0 --activate

      # Fail fast if the lockfile has a stale cacheKey. `yarn install
      # --immutable` also catches this, but its error ("would have been
      # modified by this install") reads as a general immutability
      # violation and buries the actual fix ("run yarn install locally").
      # This step spells it out so future-us doesn't burn a CI cycle
      # diagnosing the same cacheKey drift over and over.
      #
      # Expected: yarn 4.16.0 writes `cacheKey: 10c0`. If we ever bump
      # yarn, update this line AND the `corepack prepare` line above in
      # the same commit as the lockfile rewrite.
      - name: Verify yarn.lock cacheKey matches pinned yarn
        run: |
          EXPECTED_CACHEKEY="10c0"
          ACTUAL_CACHEKEY=$(grep -E '^  cacheKey:' yarn.lock | head -1 | awk '{print $2}')
          if [ "$ACTUAL_CACHEKEY" != "$EXPECTED_CACHEKEY" ]; then
            echo "::error::yarn.lock cacheKey drift detected."
            echo "  Expected: $EXPECTED_CACHEKEY (yarn 4.16.0 format)"
            echo "  Found:    $ACTUAL_CACHEKEY"
            echo ""
            echo "Fix locally, then commit yarn.lock:"
            echo "  corepack prepare yarn@4.16.0 --activate"
            echo "  yarn install"
            echo "  git add yarn.lock && git commit -m 'chore: refresh yarn.lock cacheKey'"
            exit 1
          fi
          echo "yarn.lock cacheKey OK: $ACTUAL_CACHEKEY"

      - name: Restore yarn cache
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install
        run: yarn install --immutable

      # Most workspaces need @guide-me-app/core's built output for type checking.
      - name: Build core (prereq)
        if: matrix.project != 'core'
        run: yarn workspace @guide-me-app/core build

      - name: Typecheck ${{ matrix.project }}
        run: ${{ matrix.command }}
